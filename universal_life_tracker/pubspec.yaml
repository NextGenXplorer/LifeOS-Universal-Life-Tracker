name: lifeos
description: "LifeOS - Universal Life Tracker with AI-powered features, RPG gamification, and smart automation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI/Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  lottie: ^3.0.0
  
  # State Management (BLoC)
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  
  # Database (SQLite)
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Navigation
  go_router: ^13.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Sensors & Device Features
  sensors_plus: ^4.0.2
  geolocator: ^11.0.0
  device_info_plus: ^9.1.1
  battery_plus: ^5.0.1
  vibration: ^2.0.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  
  # Voice Recognition (uses device native)
  speech_to_text: ^6.3.0
  
  # TensorFlow Lite (On-device ML)
  tflite_flutter: ^0.10.4
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  collection: ^1.18.0
  crypto: ^3.0.3
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Image handling
  image_picker: ^1.0.5
  
  # File handling
  path_provider: ^2.1.1
  
  # Workmanager for background tasks
  workmanager: ^0.5.2
  
  # Functional programming
  dartz: ^0.10.1
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # HTTP (for local server if needed)
  http: ^1.1.2
  
  # Animations
  simple_animations: ^5.0.2
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/tflite/
    - assets/images/
    - assets/animations/
    - assets/icons/
