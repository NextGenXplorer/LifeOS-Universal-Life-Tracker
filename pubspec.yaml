name: lifeos
description: A complete production-ready offline Flutter personal life management system.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  flutter_riverpod: ^2.4.9

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # AI/ML
  tflite_flutter: ^0.10.4

  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

  # Voice
  speech_to_text: ^6.5.1

  # Sensors
  sensors_plus: ^4.0.2
  pedometer: ^4.0.2
  geolocator: ^10.1.0

  # Charts
  fl_chart: ^0.66.0
  graphic: ^2.2.1

  # UI/Animations
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  csv: ^5.1.1
  pdf: ^3.10.4
  printing: ^5.11.1
  archive: ^3.4.9
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/tflite/
    - assets/animations/
